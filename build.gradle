plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.7.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}
task copyHtml(type: Copy, dependsOn: build) {
    from 'src/main/html'
    into 'build/reports'
}
task copyDocs(type: Copy, dependsOn: javadoc) {
    from 'build/docs'
    into 'build/reports'
}
task reports(dependsOn: [build, copyHtml, copyDocs])

gitPublish {
    repoUri = 'git@github.com:ODU-CS350-F26/CS350--lab4-documentation--hstro006.git'
    branch = 'gh-pages'
    contents {
        from("$buildDir/reports/index.md")
        from("$buildDir/reports") {
            exclude 'index.md'
            into 'reports'
        }
    }
}

tasks.named('gitPublishCopy') {
    dependsOn tasks.named('reports')
}

task deployReports(dependsOn: ['reports', 'gitPublishPush'])

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

