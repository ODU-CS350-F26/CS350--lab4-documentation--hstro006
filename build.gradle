plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}
task copyHtml(type: Copy, dependsOn: build) {
    from 'src/main/html'
    into 'build/reports'
}
task copyDocs(type: Copy, dependsOn: javadoc) {
    from 'build/docs'
    into 'build/reports'
}
task deployReports(dependsOn: reports) {
    doLast {
        def repoUri = 'https://odu-cs350-f26.github.io/CS350--lab4-documentation--hstro006/'
        def srcDir = file("${buildDir}/reports")
        def workDir = file("${buildDir}/gh-pages-work")

        delete workDir
        workDir.mkdirs()

        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'ls-remote', '--heads', repoUri, 'gh-pages'
            standardOutput = out
        }

        if (out.toString().trim()) {
            
            exec { commandLine 'git', 'clone', '--branch', 'gh-pages', repoUri, workDir.absolutePath }
        } else {
           
            exec { commandLine 'git', 'clone', repoUri, workDir.absolutePath }
            exec { workingDir workDir; commandLine 'git', 'checkout', '--orphan', 'gh-pages' }
            exec { workingDir workDir; commandLine 'git', 'rm', '-rf', '.' }
        }

        exec { workingDir workDir; commandLine 'git', 'add', '-A' }
        exec { workingDir workDir; commandLine 'git', 'commit', '-m', 'Update reports' }
        exec { workingDir workDir; commandLine 'git', 'push', '-f', 'origin', 'gh-pages' }
    }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

